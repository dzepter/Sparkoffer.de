name: Handel Offensiv CI

on:
  pull_request:
    paths:
      - "handel-offensiv/**"
      - ".github/workflows/handel-offensiv-ci.yml"
  push:
    branches: [main]
    paths:
      - "handel-offensiv/**"
      - ".github/workflows/handel-offensiv-ci.yml"

defaults:
  run:
    working-directory: handel-offensiv

concurrency:
  group: ho-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: handel-offensiv/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: handel-offensiv/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (ESLint, verbindlich)
        run: pnpm lint
      - name: Unit Tests (domain, validation)
        run: pnpm --filter "@handel-offensiv/domain" --filter "@handel-offensiv/validation" test

  rls-tests:
    name: RLS-Regressionstests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handel_offensiv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/handel_offensiv_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: handel-offensiv/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: handel-offensiv/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrationen + Fixtures einspielen, negative RLS-Tests ausführen
        run: pnpm --filter "@handel-offensiv/db-tests" test
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-junit
          path: handel-offensiv/supabase/tests/reports/rls-junit.xml
          if-no-files-found: ignore

  edge-functions:
    name: Edge Functions (Deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck aller Functions
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "== $f"
            deno check "$f"
          done

  build-admin:
    name: Build Admin-Cockpit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: handel-offensiv/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: handel-offensiv/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  admin-e2e:
    name: Admin Playwright Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: handel-offensiv/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: handel-offensiv/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm --filter @handel-offensiv/admin exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter @handel-offensiv/admin test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
