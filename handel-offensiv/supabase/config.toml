# Supabase-CLI-Konfiguration – Aigner Offensiv Digital (Campus + Admin)
#
# Hinweise
#  - Produktions-/Staging-Projekte liegen in der Region EU (Frankfurt,
#    eu-central-1). Diese Datei steuert die LOKALE Umgebung und wird per
#    `supabase link` + `supabase db push` auf die Remote-Projekte gespiegelt.
#  - Keine Secrets in dieser Datei: Werte wie env(RESEND_API_KEY) kommen aus
#    der Umgebung bzw. `supabase secrets set`.
project_id = "handel-offensiv"

[api]
enabled = true
port = 54321
# Nur public via PostgREST exponieren; Schema "app" bleibt intern (RLS-Hilfsfunktionen)
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# PG >= 15 noetig (UNIQUE NULLS NOT DISTINCT, security_invoker-Views)
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Basis fuer Auth-Links (Passwort-Reset, E-Mail-Aenderung). Lokal: Admin-Cockpit.
# Produktion: https://www.handel-offensiv.de/akademie (Akademie, eine Domain –
# keine Subdomains) – wird beim Anlegen der Remote-Projekte gesetzt.
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# Erlaubte Redirect-Ziele (Passwort-Reset: <Basis>/auth/callback der Web-Apps
# mit Pfad-Praefix /akademie bzw. /admin, Deep-Link der nativen App).
# Nur exakte URLs bzw. Wildcards je Host. Staging: die Vorschau-Hosts der
# Website-Shell (Vercel) werden im Supabase-Dashboard des Staging-Projekts
# ergaenzt – keine Produktions-Hosts im Staging-Projekt.
additional_redirect_urls = [
  "http://localhost:3000/admin/auth/callback",
  "http://localhost:3000/admin/auth/callback?weiter=/passwort-neu",
  "http://localhost:3001/akademie/auth/callback",
  "http://localhost:3001/akademie/auth/callback?weiter=/passwort-neu",
  "http://localhost:3100/admin/auth/callback",
  "http://localhost:3100/admin/auth/callback?weiter=/passwort-neu",
  "http://localhost:3100/akademie/auth/callback",
  "http://localhost:3100/akademie/auth/callback?weiter=/passwort-neu",
  "https://www.handel-offensiv.de/admin/auth/callback",
  "https://www.handel-offensiv.de/admin/auth/callback?weiter=/passwort-neu",
  "https://www.handel-offensiv.de/akademie/auth/callback",
  "https://www.handel-offensiv.de/akademie/auth/callback?weiter=/passwort-neu",
  "handeloffensiv://passwort-neu",
]
# Access-Token 1 Stunde gueltig, Refresh-Token-Rotation aktiv
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Keine Selbstregistrierung: Zugang ausschliesslich per Einladung
# (Admin-Invite / Edge Function mit Service Role)
enable_signup = false
# Passwortregeln: Mindestlaenge wie im Client-Schema (10), HaveIBeenPwned-Abgleich
minimum_password_length = 10
password_requirements = ""

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
# Sicherheitsabstand zwischen zwei Auth-Mails an dieselbe Adresse
max_frequency = "1m0s"

# Transaktionaler Versand ueber Resend (K-4): Absender-Subdomain
# mail.handel-offensiv.de; MX-Eintraege der Hauptdomains (Microsoft 365 /
# Strato) bleiben unangetastet.
# Lokal (supabase start) bleibt Inbucket aktiv, solange RESEND_API_KEY leer ist.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "akademie@mail.handel-offensiv.de"
sender_name = "Handel Offensiv Akademie"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Edge Functions ohne JWT-Pflicht (Token- bzw. Secret-basiert, siehe functions/README.md)
[functions.accept-invitation]
verify_jwt = false

[functions.release-scheduler]
verify_jwt = false
